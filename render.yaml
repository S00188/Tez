services:
  - type: web
    name: tezda-sotdim-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: RUN_MODE
        value: webhook
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_PATH
        value: data/bot.db
      - key: WEBHOOK_SECRET
        generateValue: true
